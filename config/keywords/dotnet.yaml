# ── .NET / C# keywords ─────────────────────────────────────────────────────────
# Add or remove keywords to control which .cs files each worker picks up.

api_keywords:
  # REST (ASP.NET Core)
  - "[ApiController]"
  - "[HttpGet]"
  - "[HttpPost]"
  - "[HttpPut]"
  - "[HttpDelete]"
  - "[HttpPatch]"
  - "[Route("
  - "ControllerBase"
  - "MinimalApi"
  # WCF — service side
  - "[ServiceContract]"
  - "[OperationContract]"
  # ASMX legacy
  - "[WebService]"
  - "[WebMethod]"
  # WCF — bindings & infrastructure
  - "BasicHttpBinding"
  - "WSHttpBinding"
  - "NetTcpBinding"
  - "NetNamedPipeBinding"
  - "System.ServiceModel"
  - "System.Web.Services"
  # SOAP — client side (auto-generated proxies / Add Service Reference)
  - "SoapClient"
  - "SoapAction"
  - "SOAPAction"
  - "ServiceReference"
  - "ClientBase"
  - "ChannelFactory"

event_keywords:
