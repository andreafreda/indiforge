  - "eventhub"
  # MassTransit / NServiceBus / Rebus
  - "MassTransit"
  - "NServiceBus"
  - "IBus"
  - "IConsumer"
  - "IPublishEndpoint"
  # Generic
  - "MessageHandler"
  - "EventHandler"
  - "consumer"
  - "producer"
  - "subscriber"
  - "publisher"

