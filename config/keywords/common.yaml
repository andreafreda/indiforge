# ── Glob patterns used by each worker ──────────────────────────────────────────
# Edit these to control which file types each worker scans.

deps_patterns:
  - "**/pom.xml"
  - "**/build.gradle"
  - "**/build.gradle.kts"
  - "**/package.json"
  - "**/requirements.txt"
  - "**/pyproject.toml"
  - "**/setup.py"
  - "**/setup.cfg"
  - "**/go.mod"
  - "**/*.csproj"
  - "**/packages.config"
  - "**/Directory.Packages.props"
  - "**/Gemfile"
  - "**/Cargo.toml"

api_patterns:
  - "**/*.java"
  - "**/*.kt"
  - "**/*.py"
  - "**/*.ts"
  - "**/*.js"
  - "**/*.cs"
  - "**/*.go"
  - "**/*.proto"
  - "**/*.wsdl"
  - "**/*.graphql"
  - "**/*.gql"
  - "**/openapi.yml"
  - "**/openapi.yaml"
  - "**/swagger.json"
  - "**/swagger.yml"

event_patterns:
  - "**/*.java"
  - "**/*.kt"
  - "**/*.py"
  - "**/*.ts"
  - "**/*.js"
  - "**/*.cs"
  - "**/*.go"
  - "**/application.yml"
  - "**/application.yaml"
  - "**/application.properties"
  - "**/docker-compose.yml"
  - "**/docker-compose.yaml"
  - "**/appsettings.json"

sequence_patterns:
  - "**/*.java"
  - "**/*.kt"
  - "**/*.py"
  - "**/*.ts"
  - "**/*.js"
  - "**/*.cs"
  - "**/*.go"

security_patterns:
  - "**/*.java"
  - "**/*.kt"
  - "**/*.py"
  - "**/*.ts"
  - "**/*.js"
  - "**/*.cs"
  - "**/*.go"
  - "**/application.yml"
  - "**/application.yaml"
  - "**/application.properties"
  - "**/appsettings.json"
  - "**/web.config"
  - "**/pom.xml"
  - "**/build.gradle"
  - "**/package.json"
  - "**/requirements.txt"
  - "**/*.csproj"
